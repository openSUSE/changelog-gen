[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-ai"
version = "0.1.1"
description = "AI-powered changelog generator using fine-tuned T5 models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Christian Goll", email = "Christian.Goll@gmail.com"}
]
keywords = ["changelog", "ai", "t5", "osc", "git", "code-to-text", "commit-message"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "tokenizers>=0.13.0",
    "ctranslate2>=4.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/mslacken/changelog-ai"
Repository = "https://github.com/mslacken/changelog-ai"
Documentation = "https://github.com/mslacken/changelog-ai#readme"
"Bug Tracker" = "https://github.com/mslacken/changelog-ai/issues"
"Model Card" = "https://huggingface.co/mslacken/t5-finetune-changelog"

[project.scripts]
changelog-ai = "changelog_ai.cli:main"
osc-ai-vc = "changelog_ai.osc_wrapper:main"

[tool.setuptools]
packages = ["changelog_ai"]

[tool.setuptools.package-data]
changelog_ai = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
